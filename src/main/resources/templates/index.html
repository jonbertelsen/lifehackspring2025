<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<title>Newsletters</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="../public/main-page/css/styles.css" th:href="@{main-page/css/styles.css}" rel="stylesheet"/>
</head>

<body>
<div class="pagewrapper">
    <header>
        <img class="logo" th:src="@{/main-page/images/lifehacklogo.png}" alt="logo"/>
    </header>
    <h1>Spring 2025</h1>
    <form class="card-grid" method="get">
        <div class="card" th:each="site : ${lifehackSites}">
            <img class="card-image" th:src="@{${site.thumbnail}}"></img>
            <div class="card-title" th:text="${site.title}"></div>
            <button class="card-cta" type="submit" th:formaction="${site.url}" th:text="${site.cta}"></button>
        </div>
    </form>
</div>

</body>
</html>
